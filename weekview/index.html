<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
<title>Two-week availability — internal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F2F3ED; --ink:#1C1E1A; --muted:#5D6257; --muted-2:#8A8D83; --line:#DEDFD6;
    --card:#FCFCF9; --sage:#839A79; --forest:#344932; --neg:#9C4A3C;
    --sage-soft:#EAEFE6; --sage-line:#C4D2BD; --forest-soft:#E6EAE3; --forest-line:#B3BFB0;
  }
  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  body{margin:0; background:var(--bg); color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;}
  button{font-family:inherit;}
  a:focus-visible,button:focus-visible{outline:2px solid var(--sage); outline-offset:2px;}

  .wrap{max-width:1000px; margin:0 auto; padding:0 28px 60px;}
  .top{display:flex; align-items:baseline; justify-content:space-between; gap:20px;
    flex-wrap:wrap; padding:26px 0 0;}
  .top a{font-size:12.5px; color:var(--muted); text-decoration:none;}
  .top a:hover{color:var(--ink); text-decoration:underline;}
  .mark{font-family:'Fraunces',serif; font-weight:600; font-size:15px;}

  h1{font-family:'Fraunces',serif; font-weight:600; font-size:clamp(26px,3.4vw,36px);
    letter-spacing:-.02em; line-height:1.08; margin:26px 0 8px;}
  .dek{font-size:15px; line-height:1.6; color:var(--muted); margin:0 0 24px; max-width:560px;}

  /* filter */
  .filters{display:flex; gap:8px; flex-wrap:wrap; margin:0 0 8px;}
  .f{padding:11px 18px; border-radius:10px; border:1.5px solid var(--line);
    background:var(--card); font-size:14px; font-weight:500; color:var(--muted);
    cursor:pointer; transition:all .14s; min-height:44px;}
  .f:hover{border-color:var(--muted-2); color:var(--ink);}
  .f[aria-pressed="true"]{background:var(--forest); border-color:var(--forest); color:#F2F3ED;}
  .fcount{font-size:12.5px; color:var(--muted-2); margin:0 0 26px;}

  /* weeks */
  .wk{margin:0 0 30px;}
  .wk-h{display:flex; align-items:baseline; gap:12px; margin:0 0 12px;}
  .wk-h h2{font-family:'Fraunces',serif; font-size:18px; font-weight:600; margin:0;}
  .wk-h span{font-size:12.5px; color:var(--muted-2);}
  .days{display:grid; grid-template-columns:repeat(7,1fr); gap:8px;}
  .d{border:1px solid var(--line); border-radius:10px; background:var(--card);
    padding:10px 8px 12px; min-height:104px;}
  .d.past{background:#EDEEE6; opacity:.55;}
  .d.none{background:#F7F8F2;}
  .d-h{text-align:center; margin:0 0 8px;}
  .d-dow{display:block; font-size:11px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--muted-2); font-weight:600;}
  .d-num{display:block; font-family:'Fraunces',serif; font-size:18px; font-weight:600; line-height:1.2;}
  .d.today{border-color:var(--sage);}
  .d.today .d-dow{color:#4A6141; font-weight:700;}
  .d.today .d-num{color:#4A6141;}
  .chips{display:flex; flex-direction:column; gap:4px;}
  .c{font-size:11.5px; font-weight:600; padding:4px 5px; border-radius:5px;
    text-align:center; font-variant-numeric:tabular-nums; white-space:nowrap;}
  .c.v{background:var(--sage-soft); border:1px solid var(--sage-line); color:#3E5537;}
  .c.p{background:var(--forest-soft); border:1px solid var(--forest-line); color:#2A3A28;}
  .d-none{font-size:11px; color:var(--muted-2); text-align:center; display:block; margin-top:12px;}

  /* copy block */
  .out{margin:34px 0 0; border:1px solid var(--line); border-radius:12px;
    background:var(--card); overflow:hidden;}
  .out-h{display:flex; align-items:center; justify-content:space-between; gap:14px;
    flex-wrap:wrap; padding:16px 20px; border-bottom:1px solid var(--line);}
  .out-h h2{font-family:'Fraunces',serif; font-size:17px; font-weight:600; margin:0;}
  .out-h p{font-size:12.5px; color:var(--muted-2); margin:3px 0 0;}
  .copy{display:inline-flex; align-items:center; gap:8px; padding:11px 20px; border-radius:9px;
    border:none; background:var(--ink); color:#fff; font-size:13.5px; font-weight:600;
    cursor:pointer; min-height:44px;}
  .copy:hover{background:#2C3029;}
  .copy.done{background:var(--sage); color:#1C2B1A;}
  #txt{padding:18px 20px; font-size:14px; line-height:1.75; color:var(--ink);
    background:var(--card); min-height:200px; white-space:pre-wrap;}
  #txt:focus{outline:none;}
  #txt b{font-weight:700; color:#2A3A28;}
  #dir{padding:18px 20px; font-size:14px; line-height:1.7; color:var(--ink);
    background:var(--card);}
  #dir:focus{outline:none;}
  #dir b{font-weight:700; color:#2A3A28;}
  #dir a{color:#4A6141;}
  #dir ul{margin:10px 0; padding-left:20px;}
  #dir li{margin:0 0 7px;}
  #txt .day{font-weight:600;}
  #txt .foot{color:var(--muted); font-size:13px;}

  .note{display:flex; align-items:center; gap:8px; margin:26px 0 0;
    font-size:12.5px; color:var(--muted-2);}
  .dot{width:7px; height:7px; border-radius:50%; background:var(--muted-2); flex-shrink:0;}
  .note.live .dot{background:var(--sage);}
  .note.bad{color:var(--neg);} .note.bad .dot{background:var(--neg);}

  @media (max-width:820px){
    .days{grid-template-columns:repeat(4,1fr);}
    .wrap{padding-left:16px; padding-right:16px;}
  }
  @media (max-width:520px){ .days{grid-template-columns:repeat(2,1fr);} }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <span class="mark">Two-week availability</span>
    <a href="../">&larr; Booking page</a>
  </div>

  <h1>What's open, next two weeks.</h1>
  <p class="dek">Your own view. Pick a session type, then copy the list at the bottom straight into an email.</p>

  <div class="filters" role="group" aria-label="Session type">
    <button class="f" data-f="both" aria-pressed="true">Both</button>
    <button class="f" data-f="virtual" aria-pressed="false">Virtual only</button>
    <button class="f" data-f="inperson" aria-pressed="false">In person only</button>
    <button class="f" data-f="allvirtual" aria-pressed="false">All as virtual</button>
  </div>
  <p class="fcount" id="fcount"></p>

  <div class="wk" id="wk0"><div class="wk-h"><h2>This week</h2><span id="wk0r"></span></div><div class="days" id="d0"></div></div>
  <div class="wk" id="wk1"><div class="wk-h"><h2>Next week</h2><span id="wk1r"></span></div><div class="days" id="d1"></div></div>

  <div class="out">
    <div class="out-h">
      <div><h2>For your email</h2><p id="outsub"></p></div>
      <button class="copy" id="copy">Copy</button>
    </div>
    <div id="txt" contenteditable="true" spellcheck="false" role="textbox" aria-multiline="true"
         aria-label="Availability text to copy — editable"></div>
  </div>

  <div class="out" style="margin-top:22px">
    <div class="out-h">
      <div><h2>Directions, for an email</h2><p>Address, map links and arrival notes</p></div>
      <button class="copy" id="copyDir">Copy</button>
    </div>
    <div id="dir" contenteditable="true" spellcheck="false" role="textbox" aria-multiline="true"
         aria-label="Directions text to copy — editable"></div>
  </div>

  <div class="note" id="note"><span class="dot"></span><span id="noteText">Checking your calendar…</span></div>
</div>

<script>
var CONFIG = {
  apiBase: "https://agp-cal.cavatello.workers.dev",
  practiceTz: "America/Los_Angeles",
  sessionMins: 53,
  bufferMins: 7,
  slotEveryMins: 60,
  // This is your own view, so it shows everything still ahead of you — no
  // 24-hour notice floor. The public booking page keeps its own.
  minNoticeHrs: 0,
  refreshSecs: 120
};

var AVAILABILITY = {
  virtual: [
    { day:1, start:"08:00", end:"09:00" },
    { day:2, start:"08:00", end:"09:00" },
    { day:2, start:"11:00", end:"13:00" },
    { day:3, start:"15:00", end:"18:00" },
    { day:5, start:"08:00", end:"09:00" }
  ],
  inperson: [
    { day:2, start:"14:00", end:"21:00" },
    { day:3, start:"07:00", end:"14:00" },
    { day:4, start:"07:00", end:"14:00" },
    { day:5, start:"14:00", end:"20:00" }
  ]
};
var LABEL = { virtual:"virtual", inperson:"in person" };

// Kept in step with CONFIG.practice on the booking page. If you change the
// arrival notes there, change them here too.
var PRACTICE = {
  address: "667 Lytton Ave, Suite 9, Palo Alto, CA 94301",
  phone: "971-514-2190",
  arrival: [
    "Look for a red-shingled house with a covered front porch and brick pillars. The number 667 is above the porch.",
    "There's no parking on the premises. Street parking is on Byron St, near the Byron and Lytton corner.",
    "Bikes can be locked to the fence out front, or around the back if you'd rather.",
    "Both the front and back doors are open. Come in and take a seat in the ground floor waiting room — there's no reception staff.",
    "I'll come out and get you at the time of your appointment."
  ]
};
var TITLE = { virtual:"Virtual", inperson:"In person" };

/* ---- timezone helpers: template is wall clock, everything else is an instant ---- */
function tzOffsetMs(instant, tz){
  var f = new Intl.DateTimeFormat("en-US",{ timeZone:tz, hour12:false,
    year:"numeric", month:"2-digit", day:"2-digit",
    hour:"2-digit", minute:"2-digit", second:"2-digit" });
  var p = {}; f.formatToParts(instant).forEach(function(x){ p[x.type]=x.value; });
  return Date.UTC(+p.year, +p.month-1, +p.day, (+p.hour)%24, +p.minute, +p.second) - instant.getTime();
}
function wallToEpoch(y,m,d,hh,mm,tz){
  var naive = Date.UTC(y,m-1,d,hh,mm,0);
  var ts = naive - tzOffsetMs(new Date(naive), tz);
  return naive - tzOffsetMs(new Date(ts), tz);
}
function tzParts(instant, tz){
  var f = new Intl.DateTimeFormat("en-CA",{ timeZone:tz,
    year:"numeric", month:"2-digit", day:"2-digit", weekday:"short" });
  var p = {}; f.formatToParts(instant).forEach(function(x){ p[x.type]=x.value; });
  var dow = { Sun:0, Mon:1, Tue:2, Wed:3, Thu:4, Fri:5, Sat:6 };
  return { y:+p.y||+p.year, m:+p.month, d:+p.day, dow:dow[p.weekday] };
}
function hhmm(s){ var a=s.split(":"); return (+a[0])*60 + (+a[1]); }
var TZ = CONFIG.practiceTz;
function fmtTime(ts){ return new Intl.DateTimeFormat("en-US",{ timeZone:TZ, hour:"numeric", minute:"2-digit" }).format(new Date(ts)).replace(/\u202f/g," "); }
function fmtDay(ts){ return new Intl.DateTimeFormat("en-US",{ timeZone:TZ, weekday:"short", month:"short", day:"numeric" }).format(new Date(ts)); }

/* ---- state ---- */
var state = { filter:"both", busy:[], status:"loading", fetchedAt:null, plain:"", dirPlain:"" };

/* Sunday of the current week, in practice-local time. */
function weekStart(){
  var p = tzParts(new Date(), TZ);
  var midnight = wallToEpoch(p.y,p.m,p.d,0,0,TZ);
  return midnight - p.dow * 86400000;
}
function dayAt(n){
  var t = weekStart() + n*86400000;
  var p = tzParts(new Date(t), TZ);
  return wallToEpoch(p.y,p.m,p.d,0,0,TZ);   // re-anchor across any DST shift
}

function overlapsBusy(a,b){
  for (var i=0;i<state.busy.length;i++)
    if (a < state.busy[i].end && b > state.busy[i].start) return true;
  return false;
}

/* Every open slot on a day, tagged with its mode. */
function slotsFor(dayEpoch){
  var out = [];
  var p = tzParts(new Date(dayEpoch), TZ);
  var sessionMs = CONFIG.sessionMins*60000;
  var blockMs = (CONFIG.sessionMins+CONFIG.bufferMins)*60000;
  var step = CONFIG.slotEveryMins*60000;
  var floor = Date.now() + CONFIG.minNoticeHrs*3600000;
  // "allvirtual" takes every window on the calendar — including the ones you'd
  // normally be in the office for — and offers the lot as video. You're there
  // either way, so the in-person hours are bookable virtually too.
  var asVirtual = state.filter === "allvirtual";
  var modes = (state.filter === "both" || asVirtual) ? ["virtual","inperson"] : [state.filter];

  modes.forEach(function(mode){
    AVAILABILITY[mode].forEach(function(w){
      if (w.day !== p.dow) return;
      var s = hhmm(w.start), e = hhmm(w.end);
      var ws = wallToEpoch(p.y,p.m,p.d,Math.floor(s/60),s%60,TZ);
      var we = wallToEpoch(p.y,p.m,p.d,Math.floor(e/60),e%60,TZ);
      for (var t=ws; t+sessionMs<=we; t+=step){
        if (t < floor) continue;
        if (overlapsBusy(t, Math.min(t+blockMs, we))) continue;
        out.push({ start:t, end:t+sessionMs, mode: asVirtual ? "virtual" : mode });
      }
    });
  });
  return out.sort(function(a,b){ return a.start-b.start; });
}

/* ---- fetch ---- */
// Each call gets a generation number and only the newest may write to state.
// Without this a slow earlier request can land after a later failure and flip
// the page back to "live", showing slots built from stale busy data.
var loadGen = 0;
function load(){
  var gen = ++loadGen;
  var start = new Date(dayAt(0)).toISOString();
  var end   = new Date(dayAt(14)).toISOString();
  return fetch(CONFIG.apiBase.replace(/\/$/,"") + "/freebusy?start=" +
      encodeURIComponent(start) + "&end=" + encodeURIComponent(end))
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(function(j){
      if (gen !== loadGen) return;
      state.busy = (j.busy||[]).map(function(b){ return { start:Date.parse(b.start), end:Date.parse(b.end) }; })
                               .filter(function(b){ return b.start && b.end; });
      // Template comes from the Worker so /admin/ edits reach every page.
      if (j.availability && j.availability.virtual && j.availability.inperson){
        AVAILABILITY = j.availability;
      }
      state.status = "live"; state.fetchedAt = Date.now();
    })
    .catch(function(){
      if (gen !== loadGen) return;
      // Drop what we had: a stale picture is worse than an empty one when the
      // whole point is emailing someone times that are actually free.
      state.busy = [];
      state.status = "error";
    })
    .then(function(){ if (gen === loadGen) render(); });
}

/* ---- render ---- */
var $ = function(id){ return document.getElementById(id); };

function render(){
  document.querySelectorAll(".f").forEach(function(b){
    b.setAttribute("aria-pressed", String(b.dataset.f === state.filter));
  });

  var todayMid = (function(){ var p=tzParts(new Date(),TZ); return wallToEpoch(p.y,p.m,p.d,0,0,TZ); })();
  var total = 0;
  var byDay = [];

  for (var w=0; w<2; w++){
    var host = $("d"+w); host.innerHTML = "";
    for (var i=0;i<7;i++){
      var n = w*7+i, ds = dayAt(n);
      var slots = state.status === "live" ? slotsFor(ds) : [];
      total += slots.length;
      byDay.push({ ds:ds, slots:slots });

      // Declared before it is used: var is function-scoped, so reading it above
      // its assignment gives undefined on the first pass and the PREVIOUS day's
      // value on every pass after — marking the wrong cell.
      var isToday = ds === todayMid;
      var cell = document.createElement("div");
      cell.className = "d" + (ds < todayMid ? " past" : "") +
                       (isToday ? " today" : "") +
                       (slots.length ? "" : " none");
      var dow = new Intl.DateTimeFormat("en-US",{timeZone:TZ,weekday:"short"}).format(new Date(ds));
      var num = new Intl.DateTimeFormat("en-US",{timeZone:TZ,day:"numeric"}).format(new Date(ds));
      var html = '<div class="d-h"><span class="d-dow">'+(isToday ? "Today" : dow)+
                 '</span><span class="d-num">'+num+'</span></div>';
      if (slots.length){
        html += '<div class="chips">' + slots.map(function(s){
          return '<span class="c '+(s.mode==="virtual"?"v":"p")+'">'+fmtTime(s.start)+'</span>';
        }).join("") + '</div>';
      } else {
        html += '<span class="d-none">'+(ds < todayMid ? "past" : "—")+'</span>';
      }
      cell.innerHTML = html;
      host.appendChild(cell);
    }
    var a = dayAt(w*7), b = dayAt(w*7+6);
    $("wk"+w+"r").textContent =
      new Intl.DateTimeFormat("en-US",{timeZone:TZ,month:"short",day:"numeric"}).format(new Date(a)) +
      " – " +
      new Intl.DateTimeFormat("en-US",{timeZone:TZ,month:"short",day:"numeric"}).format(new Date(b));
  }

  var lbl = state.filter === "both" ? "virtual and in person"
          : state.filter === "virtual" ? "virtual only"
          : state.filter === "inperson" ? "in person"
          : "all offered as virtual, including office hours";
  $("fcount").textContent = state.status === "live"
    ? total + " opening" + (total===1?"":"s") + " over two weeks · " + lbl
    : "";

  buildText(byDay);
  renderNote();
}

/* Output grouped by session type under each day. With one type selected the
   sub-headings would repeat on every line, so it collapses to a flat list and
   states the type once at the bottom instead. */
/* The plain-text form of whatever is currently in the preview, including any
   edits. One function so the clipboard and anything checking it can never
   disagree about what is actually being sent. */
function plainText(){
  return $("txt").innerText
    .replace(/\u00a0/g, " ")
    .replace(/^[ \t]+$/gm, "")
    .replace(/\n{3,}/g, "\n\n")
    .trim();
}

var esc = function(t){ return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); };

/* Builds both flavours at once. Plain text is the fallback for anywhere that
   can't take markup; the HTML version keeps Virtual / In person bold when it
   lands in Gmail, Mail or Outlook. */
function buildText(byDay){
  var plain = [], html = [];
  var dayCount = 0;
  var single = state.filter !== "both";   // allvirtual is one type, so it collapses too

  byDay.forEach(function(d){
    if (!d.slots.length) return;
    dayCount++;
    var day = fmtDay(d.ds);

    if (single){
      var times = d.slots.map(function(s){ return fmtTime(s.start); }).join(", ");
      plain.push(day + " — " + times);
      html.push('<div><span class="day">' + esc(day) + '</span> — ' + esc(times) + '</div>');
      return;
    }

    var pl = [day], hl = ['<div class="day">' + esc(day) + '</div>'];
    ["virtual","inperson"].forEach(function(mode){
      var t = d.slots.filter(function(s){ return s.mode === mode; });
      if (!t.length) return;
      var times = t.map(function(s){ return fmtTime(s.start); }).join(", ");
      pl.push("  " + TITLE[mode] + ": " + times);
      hl.push('<div>&nbsp;&nbsp;<b>' + esc(TITLE[mode]) + ':</b> ' + esc(times) + '</div>');
    });
    plain.push(pl.join("\n"));
    html.push(hl.join(""));
  });

  var footer = "All times Pacific. Sessions are " + CONFIG.sessionMins + " minutes.";
  if (state.filter === "allvirtual") footer = "All virtual. " + footer;
  else if (single) footer = "All " + LABEL[state.filter] + ". " + footer;

  if (!plain.length){
    var none = "No openings in the next two weeks for this selection.";
    state.plain = none;
    $("txt").innerHTML = '<div class="foot">' + esc(none) + '</div>';
  } else {
    state.plain = plain.join(single ? "\n" : "\n\n") + "\n\n" + footer;
    $("txt").innerHTML = html.join(single ? "" : '<div><br></div>') +
      '<div><br></div><div class="foot">' + esc(footer) + '</div>';
  }

  $("outsub").textContent = dayCount
    ? dayCount + " day" + (dayCount===1?"":"s") + " with openings"
    : "nothing to send yet";
}

function renderNote(){
  var el = $("note"), t = $("noteText");
  el.className = "note";
  if (state.status === "live"){
    el.classList.add("live");
    t.textContent = "Live from your calendar — checked " + fmtTime(state.fetchedAt) + ".";
  } else if (state.status === "error"){
    el.classList.add("bad");
    t.textContent = "Couldn't reach your calendar, so nothing is shown. These would be guesses otherwise.";
  } else {
    t.textContent = "Checking your calendar…";
  }
}

/* Directions in both flavours. The map links only survive as links if the
   clipboard carries HTML — plain text keeps the raw URLs so nothing is lost. */
function buildDirections(){
  var P = PRACTICE;
  var q = encodeURIComponent(P.address);
  var gmap = "https://www.google.com/maps/search/?api=1&query=" + q;
  var amap = "https://maps.apple.com/?q=" + q;
  var tel  = P.phone.replace(/[^0-9+]/g, "");

  $("dir").innerHTML =
    '<div><b>' + esc(P.address) + '</b></div>' +
    '<div><a href="' + gmap + '">Open in Google Maps</a> &nbsp;&middot;&nbsp; ' +
    '<a href="' + amap + '">Apple Maps</a></div>' +
    '<ul>' + P.arrival.map(function(l){ return '<li>' + esc(l) + '</li>'; }).join("") + '</ul>' +
    '<div>Any questions before you come, email me or text ' +
    '<a href="tel:' + tel + '">' + esc(P.phone) + '</a>.</div>';

  state.dirPlain =
    P.address + "\n\n" +
    "Google Maps: " + gmap + "\n" +
    "Apple Maps:  " + amap + "\n\n" +
    P.arrival.map(function(l){ return "- " + l; }).join("\n") + "\n\n" +
    "Any questions before you come, email me or text " + P.phone + ".";
}

/* ---- wiring ---- */
document.querySelectorAll(".f").forEach(function(b){
  b.onclick = function(){ state.filter = b.dataset.f; render(); };
});

function copyRich(el, plain, btn){
  var done = function(){
    btn.textContent = "Copied"; btn.classList.add("done");
    setTimeout(function(){ btn.textContent = "Copy"; btn.classList.remove("done"); }, 1600);
  };
  var htmlOut = '<div style="font-family:-apple-system,Segoe UI,sans-serif;font-size:14px;line-height:1.6">' +
                el.innerHTML + '</div>';
  if (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write){
    navigator.clipboard.write([new ClipboardItem({
      "text/html":  new Blob([htmlOut], { type:"text/html"  }),
      "text/plain": new Blob([plain],   { type:"text/plain" })
    })]).then(done, function(){ navigator.clipboard.writeText(plain).then(done); });
  } else if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(plain).then(done);
  } else {
    var r = document.createRange(); r.selectNodeContents(el);
    var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
    document.execCommand("copy"); sel.removeAllRanges(); done();
  }
}

$("copyDir").onclick = function(){
  copyRich($("dir"), state.dirPlain, $("copyDir"));
};

$("copy").onclick = function(){
  var el = $("txt"), btn = $("copy");
  var done = function(){
    btn.textContent = "Copied"; btn.classList.add("done");
    setTimeout(function(){ btn.textContent = "Copy"; btn.classList.remove("done"); }, 1600);
  };
  // Read from the element so any edits you make are what gets copied.
  var htmlOut = '<div style="font-family:-apple-system,Segoe UI,sans-serif;font-size:14px;line-height:1.6">' +
                el.innerHTML + '</div>';
  var textOut = plainText();

  // Write both flavours so a rich editor keeps the bold and a plain field still works.
  if (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write){
    navigator.clipboard.write([new ClipboardItem({
      "text/html":  new Blob([htmlOut],  { type:"text/html"  }),
      "text/plain": new Blob([textOut], { type:"text/plain" })
    })]).then(done, function(){ navigator.clipboard.writeText(textOut).then(done); });
  } else if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(textOut).then(done);
  } else {
    var r = document.createRange(); r.selectNodeContents(el);
    var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
    document.execCommand("copy"); sel.removeAllRanges(); done();
  }
};

buildDirections();
render();
load();
setInterval(load, CONFIG.refreshSecs * 1000);
</script>
