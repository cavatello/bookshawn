name = "agp-cal"
main = "worker.js"
compatibility_date = "2026-07-01"

[vars]
# Comma-separated if sessions live on more than one calendar.
CALENDAR_ID    = "shawn@agoodplacetherapy.com"
# Comma-separated. localhost is included so `node dev/serve.js` can reach the
# Worker during development. Remove it if you'd rather only the live site can.
ALLOWED_ORIGIN = "https://cavatello.github.io,http://localhost:8099"
PRACTICE_TZ    = "America/Los_Angeles"

# Shown as the event Location and in the invite the client receives.
OFFICE_ADDRESS = "667 Lytton Ave, Suite 9, Palo Alto, CA 94301"

# "meet"  -> Google mints a fresh Meet link for every booking (recommended)
# a URL   -> used as-is. For Zoom, DO NOT put it here; this file is committed to
#            a public repo. Instead: npx wrangler secret put VIRTUAL_LOCATION
VIRTUAL_LOCATION = "meet"

# "true" adds the requester as an attendee so Google emails them a calendar
# invite. Set "false" and no email is sent at all — the page then says only
# that a hold was placed, never that a confirmation went out.
SEND_INVITES   = "true"

# Secrets are NOT set here. Run these once after `wrangler login`:
#   npx wrangler secret put GOOGLE_CLIENT_ID
#   npx wrangler secret put GOOGLE_CLIENT_SECRET
#   npx wrangler secret put GOOGLE_REFRESH_TOKEN
