name = "agp-cal"
main = "worker.js"
compatibility_date = "2026-07-01"

[vars]
# Comma-separated if sessions live on more than one calendar.
CALENDAR_ID    = "shawn@agoodplacetherapy.com"
# Comma-separated. localhost is included so `node dev/serve.js` can reach the
# Worker during development. Remove it if you'd rather only the live site can.
ALLOWED_ORIGIN = "https://cavatello.github.io,http://localhost:8099"
PRACTICE_TZ    = "America/Los_Angeles"

# How much warning you need before a session. Must match minNoticeHrs in
# index.html — the page decides what to offer, this decides what to accept.
#   24 -> tomorrow morning is only bookable if they book before this time yesterday
#   12 -> all of tomorrow is bookable from midday today
#    8 -> effectively all of tomorrow, from any time today
MIN_NOTICE_HOURS = "12"

# Shown as the event Location and in the invite the client receives.
OFFICE_ADDRESS = "667 Lytton Ave, Suite 9, Palo Alto, CA 94301"

# "meet"  -> Google mints a fresh Meet link for every booking
# a URL   -> used as-is for every virtual session
#
# NOTE: this file is committed to a PUBLIC repo, so the value below is public.
# A Zoom personal room only stays private if your waiting room is on — see
# SETUP.md. To keep it out of the repo instead:
#   1. delete this line   2. npx wrangler deploy   3. npx wrangler secret put VIRTUAL_LOCATION
VIRTUAL_LOCATION = "https://agoodplace.zoom.us/my/shawnwalters"

# "true" adds the requester as an attendee so Google emails them a calendar
# invite. Set "false" and no email is sent at all — the page then says only
# that a hold was placed, never that a confirmation went out.
SEND_INVITES   = "true"

# Secrets are NOT set here. Run these once after `wrangler login`:
#   npx wrangler secret put GOOGLE_CLIENT_ID
#   npx wrangler secret put GOOGLE_CLIENT_SECRET
#   npx wrangler secret put GOOGLE_REFRESH_TOKEN

# Storage for the weekly template, so /admin/ can change it without a deploy.
# Create it once, then paste the id it prints:
#   npx wrangler kv namespace create SETTINGS
# Until this is set the Worker falls back to the template baked into worker.js.
[[kv_namespaces]]
binding = "SETTINGS"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# The admin password. NOT a var — set it as a secret so it never enters the repo:
#   npx wrangler secret put ADMIN_TOKEN
# With no token set, /admin/ is locked and writes are refused.
